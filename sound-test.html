<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sound check · Thai with Palm</title>
<style>
 body{font-family:system-ui,Segoe UI,Roboto,sans-serif;background:#fff6f0;color:#3a3340;margin:0;padding:16px;max-width:560px;margin:auto}
 h1{font-size:22px;margin:6px 0 2px} p{margin:4px 0 12px;color:#6d6475;font-size:14px}
 .card{background:#fff;border-radius:16px;padding:14px;margin:12px 0;box-shadow:0 2px 10px rgba(0,0,0,.07)}
 button{border:none;border-radius:12px;padding:11px 14px;font-weight:800;font-size:15px;cursor:pointer;background:#13a89e;color:#fff;margin:4px 6px 4px 0}
 button.alt{background:#ff7a59} button.no{background:#e0556b} button.ok{background:#2f9e59}
 .th{font-size:26px;font-weight:700} .res{font-size:14px;margin-top:6px;white-space:pre-wrap}
 pre{background:#f3ece6;border-radius:10px;padding:10px;font-size:12.5px;white-space:pre-wrap;word-break:break-word}
</style></head><body>
<h1>🔊 Sound check</h1>
<p>Open this page on the device that has no sound / wrong sound. Tap each ▶ button, then tell it if you heard Thai.</p>
<div class="card"><b>Your browser</b><div class="res" id="env"></div></div>

<div class="card"><div class="th">สวัสดีค่ะ</div>
 <button id="g1">▶ Test 1 · Online voice</button><button class="alt" id="g2">▶ Test 2 · Device voice</button>
 <div class="res" id="r1"></div></div>

<div class="card"><div class="th">คิดดูดี ๆ ก่อนนะ</div><p>The sentence that used to stutter ("dii-dii-dii").</p>
 <button id="g3">▶ Play it (online voice)</button><button class="alt" id="g4">▶ Play it (device voice)</button>
 <div class="res" id="r2"></div></div>

<div class="card"><b>Your answers</b>
 <p>After each test tap what you heard:</p>
 <div id="ans"></div>
 <button id="copy" class="alt">📋 Copy results for Teacher Palm</button>
 <pre id="out"></pre></div>

<script>
const R={};
const names={t1:"Test 1 online voice",t2:"Test 2 device voice",t3:"Sentence · online voice",t4:"Sentence · device voice"};
const env=document.getElementById("env");
let voices=[]; function lv(){ try{voices=speechSynthesis.getVoices()||[]}catch(e){voices=[]} show(); }
function thaiVoices(){ return voices.filter(v=>/^th|thai/i.test(v.lang)||/thai/i.test(v.name)); }
function show(){
  env.textContent = navigator.userAgent + "\n\nThai voices on this device: " + (thaiVoices().map(v=>v.name+" ("+v.lang+")").join("; ")||"none found")
   + "\nspeechSynthesis: " + ("speechSynthesis" in window ? "yes" : "NO");
  R.voices = thaiVoices().map(v=>v.name).join("; ")||"none"; R.ua=navigator.userAgent; render();
}
try{ lv(); speechSynthesis.onvoiceschanged=lv; setTimeout(lv,600);}catch(e){ show(); }

// same clean-up as the app (repeat mark ๆ written out)
function clean(t){ return t.replace(/ดี\s*ๆ/g,"ดีดี").replace(/\s*ๆ/g,"").replace(/\s+/g," ").trim(); }
const a = new Audio(); a.referrerPolicy="no-referrer";
function online(text,out,key){
  const url="https://translate.google.com/translate_tts?ie=UTF-8&tl=th&client=tw-ob&q="+encodeURIComponent(clean(text));
  out.textContent="… loading"; a.onerror=()=>{ out.textContent="❌ The online voice could not load on this network/browser."; R[key+"_load"]="error"; render(); };
  a.src=url; a.playbackRate=.78;
  a.play().then(()=>{ out.textContent="▶ Playing… did you hear Thai?"; R[key+"_load"]="playing"; render(); })
   .catch(e=>{ out.textContent="❌ Browser blocked/failed: "+(e&&e.name); R[key+"_load"]="blocked "+(e&&e.name); render(); });
}
function device(text,out,key){
  try{
    const th=thaiVoices(); if(!th.length){ out.textContent="❌ No Thai voice installed on this device."; R[key+"_load"]="no voice"; render(); return; }
    const u=new SpeechSynthesisUtterance(clean(text)); u.voice=th[0]; u.lang=th[0].lang||"th-TH"; u.rate=.85;
    u.onstart=()=>{ out.textContent="▶ Playing with: "+th[0].name+" — did you hear Thai?"; R[key+"_load"]="playing"; render(); };
    u.onerror=e=>{ out.textContent="❌ Voice error: "+e.error; R[key+"_load"]="error "+e.error; render(); };
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  }catch(e){ out.textContent="❌ "+e; }
}
const r1=document.getElementById("r1"), r2=document.getElementById("r2");
document.getElementById("g1").onclick=()=>online("สวัสดีค่ะ",r1,"t1");
document.getElementById("g2").onclick=()=>device("สวัสดีค่ะ",r1,"t2");
document.getElementById("g3").onclick=()=>online("คิดดูดี ๆ ก่อนนะ",r2,"t3");
document.getElementById("g4").onclick=()=>device("คิดดูดี ๆ ก่อนนะ",r2,"t4");
const ans=document.getElementById("ans");
Object.keys(names).forEach(k=>{ const d=document.createElement("div"); d.innerHTML="<b>"+names[k]+"</b> ";
  [["✅ heard it, clear","ok"],["🔇 no sound","no"],["😵 repeats / wrong","no"]].forEach(([t,c])=>{ const b=document.createElement("button"); b.textContent=t; b.className=c; b.onclick=()=>{ R[k]=t; render(); }; d.appendChild(b); });
  ans.appendChild(d); });
function render(){ document.getElementById("out").textContent =
 "Thai with Palm — sound check\n"+Object.keys(names).map(k=>names[k]+": "+(R[k]||"-")+(R[k+"_load"]?"  ["+R[k+"_load"]+"]":"")).join("\n")+"\nThai voices: "+(R.voices||"?")+"\n"+(R.ua||""); }
document.getElementById("copy").onclick=()=>{ const t=document.getElementById("out").textContent; (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>alert("Copied! Paste it to Teacher Palm.")).catch(()=>{ const r=document.createRange(); r.selectNodeContents(document.getElementById("out")); getSelection().removeAllRanges(); getSelection().addRange(r); }); };
render();
</script></body></html>
