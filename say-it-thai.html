<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found]){display:none!important}</style></head><body>
<title>Say It Thai</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600;700&family=Nunito:wght@400;600;700;800;900&display=swap">
<style>
  /* ============ TOKENS ============ */
  :root{
    --bg:#FFFDF7;
    --surface:#FFFFFF;
    --surface-2:#FFF8EC;
    --ink:#2D3142;
    --ink-soft:#6B7280;
    --teal:#147D82;
    --teal-dark:#0F5F63;
    --teal-tint:#E3F3F2;
    --gold:#FFD166;
    --gold-ink:#7A5B00;
    --karaoke:#0000C5;
    --green:#06D6A0;
    --coral:#FF6B6B;
    --border:#ECE3D2;
    --shadow:rgba(45,49,66,0.14);
    --stage-1:#147D82;
    --stage-2:#0F5F63;
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0F1E1D;
      --surface:#173230;
      --surface-2:#1C3B38;
      --ink:#F3F1E6;
      --ink-soft:#B7C6C3;
      --teal:#4FC3BA;
      --teal-dark:#37948C;
      --teal-tint:#1C3B38;
      --gold:#FFD166;
      --gold-ink:#3A2C00;
      --karaoke:#95A5FF;
      --green:#4CE3B4;
      --coral:#FF8A8A;
      --border:#2A4442;
      --shadow:rgba(0,0,0,0.45);
      --stage-1:#0F2C2A;
      --stage-2:#0A1E1D;
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0F1E1D;
    --surface:#173230;
    --surface-2:#1C3B38;
    --ink:#F3F1E6;
    --ink-soft:#B7C6C3;
    --teal:#4FC3BA;
    --teal-dark:#37948C;
    --teal-tint:#1C3B38;
    --gold:#FFD166;
    --gold-ink:#3A2C00;
    --karaoke:#95A5FF;
    --green:#4CE3B4;
    --coral:#FF8A8A;
    --border:#2A4442;
    --shadow:rgba(0,0,0,0.45);
    --stage-1:#0F2C2A;
    --stage-2:#0A1E1D;
    color-scheme:dark;
  }

  /* ============ RESET / BASE ============ */
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Nunito',-apple-system,'Segoe UI',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{font-family:'Nunito','Segoe UI',sans-serif;font-weight:800;margin:0;text-wrap:balance;}
  p{margin:0;}
  button{font-family:inherit;}
  .thai{font-family:'Mitr','Noto Sans Thai','Leelawadee UI',sans-serif;}
  .eyebrow{font-weight:800;font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;}
  :focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:6px;}
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important;}
  }

  /* ============ APP SHELL ============ */
  #app{min-height:100vh;display:flex;flex-direction:column;}
  .view{display:none;}
  .view.active{display:block;}

  .topnav{
    display:flex;align-items:center;justify-content:space-between;gap:1rem;
    padding:1rem 1.5rem;max-width:1100px;margin:0 auto;width:100%;
  }
  .brand{display:flex;align-items:center;gap:.55rem;font-weight:900;font-size:1.15rem;color:var(--ink);text-decoration:none;background:none;border:none;cursor:pointer;padding:0;}
  .brand .mark{
    width:2.1rem;height:2.1rem;border-radius:50%;background:var(--teal);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:1.05rem;flex-shrink:0;
  }
  .btn{
    display:inline-flex;align-items:center;gap:.4rem;
    font-weight:800;font-size:.88rem;border-radius:999px;border:2px solid transparent;
    padding:.6rem 1.1rem;cursor:pointer;transition:transform .12s ease, box-shadow .12s ease, background .15s ease;
    white-space:nowrap;
  }
  .btn:active{transform:scale(.96);}
  .btn-gold{background:var(--gold);color:var(--gold-ink);}
  .btn-gold:hover{box-shadow:0 6px 16px -6px var(--shadow);}
  .btn-outline{background:transparent;border-color:var(--border);color:var(--ink);}
  .btn-outline:hover{border-color:var(--teal);color:var(--teal);}
  .btn-ghost{background:transparent;border:none;color:var(--ink-soft);}
  .btn-ghost:hover{color:var(--teal);}
  .btn-teal{background:var(--teal);color:#fff;}
  .btn-teal:hover{background:var(--teal-dark);}
  .btn-sm{padding:.4rem .8rem;font-size:.78rem;}
  .btn[disabled]{opacity:.5;cursor:not-allowed;}

  /* ============ HOME ============ */
  .hero{
    position:relative;overflow:hidden;
    background:linear-gradient(155deg,var(--stage-1),var(--stage-2));
    padding:2.6rem 1.5rem 4rem;text-align:center;
  }
  .hero-circle{position:absolute;border-radius:50%;opacity:.55;filter:blur(1px);}
  .hero-inner{position:relative;max-width:640px;margin:0 auto;}
  .pill{
    display:inline-flex;align-items:center;gap:.4rem;background:var(--gold);color:var(--gold-ink);
    font-weight:800;font-size:.8rem;letter-spacing:.03em;border-radius:999px;padding:.45rem 1rem;margin-bottom:1.1rem;
  }
  .hero h1{color:#fff;font-size:clamp(1.8rem,4.2vw,2.6rem);line-height:1.15;margin-bottom:.65rem;}
  .hero p{color:rgba(255,255,255,.86);font-size:1.05rem;font-weight:600;max-width:32rem;margin:0 auto;}

  .topics-wrap{max-width:1100px;margin:0 auto;padding:0 1.5rem 3rem;}
  .topics-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:1.1rem;margin-top:-2.4rem;position:relative;z-index:2;}
  .topic-card{
    background:var(--surface);border-radius:22px;padding:1.3rem 1.3rem 1.5rem;
    box-shadow:0 10px 28px -14px var(--shadow);border:1px solid var(--border);
    cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:.85rem;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .topic-card:hover{transform:translateY(-4px);box-shadow:0 16px 32px -14px var(--shadow);}
  .topic-icon{width:3.1rem;height:3.1rem;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.5rem;}
  .topic-card h3{font-size:1.08rem;line-height:1.3;}
  .topic-meta{color:var(--ink-soft);font-weight:700;font-size:.85rem;}
  .shuffle-card{background:linear-gradient(135deg,var(--teal),var(--teal-dark));color:#fff;}
  .shuffle-card .topic-meta{color:rgba(255,255,255,.8);}
  .shuffle-card h3{color:#fff;}
  .shuffle-card .topic-icon{background:rgba(255,255,255,.22);}
  .footer-note{text-align:center;color:var(--ink-soft);font-size:.78rem;font-weight:700;padding:1.5rem;}

  /* ============ PLAY ============ */
  .stage{min-height:100vh;background:linear-gradient(155deg,var(--stage-1),var(--stage-2));display:flex;flex-direction:column;}
  .stage-bar{
    display:flex;align-items:center;justify-content:space-between;gap:.75rem;flex-wrap:wrap;
    padding:1.1rem 1.3rem;max-width:1180px;margin:0 auto;width:100%;
  }
  .stage-bar-left{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;}
  .stage-title{color:#fff;font-weight:800;display:flex;align-items:center;gap:.5rem;font-size:1rem;}
  .progress-pill{background:rgba(255,255,255,.16);color:#fff;font-weight:800;font-size:.82rem;border-radius:999px;padding:.35rem .85rem;}
  .mode-toggle{display:flex;background:rgba(255,255,255,.14);border-radius:999px;padding:.25rem;gap:.2rem;}
  .mode-btn{
    border:none;background:transparent;color:rgba(255,255,255,.75);font-weight:800;font-size:.78rem;
    padding:.42rem .85rem;border-radius:999px;cursor:pointer;transition:background .15s, color .15s;white-space:nowrap;
  }
  .mode-btn.active{background:#fff;color:var(--teal-dark);}
  .mode-caption{color:rgba(255,255,255,.75);font-weight:700;font-size:.78rem;text-align:center;padding:0 1.3rem .4rem;max-width:1180px;margin:0 auto;width:100%;}

  .stage-body{flex:1;display:flex;min-height:0;max-width:1180px;margin:0 auto;width:100%;position:relative;}

  /* ---- sidebar ---- */
  .word-sidebar{
    width:250px;flex-shrink:0;overflow-y:auto;padding:.5rem .7rem 1.5rem;
    display:flex;flex-direction:column;gap:.3rem;
  }
  .sidebar-item{
    display:flex;align-items:center;gap:.55rem;padding:.5rem .65rem;border-radius:12px;
    background:transparent;border:none;color:rgba(255,255,255,.82);cursor:pointer;text-align:left;width:100%;
    font-size:.85rem;font-weight:700;transition:background .12s ease;
  }
  .sidebar-item:hover{background:rgba(255,255,255,.12);}
  .sidebar-item.current{background:#fff;color:var(--teal-dark);}
  .sidebar-num{
    width:1.5rem;height:1.5rem;border-radius:50%;background:rgba(255,255,255,.18);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:.72rem;flex-shrink:0;font-weight:900;
  }
  .sidebar-item.current .sidebar-num{background:var(--teal);color:#fff;}
  .sidebar-item .sw{font-family:'Mitr','Noto Sans Thai',sans-serif;font-size:.95rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .sidebar-backdrop{display:none;}
  .sidebar-toggle-btn{display:none;}

  @media (max-width:860px){
    .word-sidebar{
      position:fixed;top:0;bottom:0;left:0;width:min(82vw,320px);z-index:60;
      background:linear-gradient(180deg,var(--stage-1),var(--stage-2));
      padding-top:1rem;transform:translateX(-105%);transition:transform .28s cubic-bezier(.2,.8,.3,1);
      box-shadow:12px 0 30px -10px rgba(0,0,0,.4);
    }
    .word-sidebar.open{transform:translateX(0);}
    .sidebar-backdrop{
      display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:55;
    }
    .sidebar-backdrop.open{display:block;}
    .sidebar-toggle-btn{display:inline-flex;}
  }

  .stage-main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1rem 1.3rem 2.5rem;min-width:0;}
  .card-wrap{width:100%;max-width:560px;}
  .flashcard{
    position:relative;background:var(--surface);border-radius:28px;padding:2.4rem 1.8rem 2rem;
    box-shadow:0 24px 60px -20px rgba(0,0,0,.4);min-height:380px;
    display:flex;flex-direction:column;align-items:center;text-align:center;gap:.55rem;
    animation:cardIn .6s cubic-bezier(.16,1,.3,1) both;
  }
  .flashcard.playable{cursor:pointer;}
  @keyframes cardIn{from{opacity:0;transform:translateY(14px) scale(.99);}to{opacity:1;transform:none;}}
  .card-badge{
    position:absolute;top:-18px;left:24px;width:2.6rem;height:2.6rem;border-radius:50%;
    background:var(--teal);color:#fff;display:flex;align-items:center;justify-content:center;
    font-weight:900;font-size:1.05rem;box-shadow:0 6px 14px -4px var(--shadow);
  }
  .card-icon{width:4.2rem;height:4.2rem;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:2rem;margin-bottom:.3rem;}
  .thai-word{font-size:1.35rem;font-weight:600;color:var(--ink);margin:.15rem 0;}
  .prompt-label{color:var(--ink-soft);font-weight:700;font-size:.95rem;}
  .reveal-zone{display:flex;flex-direction:column;align-items:center;gap:.5rem;min-height:2.4em;justify-content:center;}

  /* slow, gentle reveal */
  .karaoke-big{font-family:'Nunito';font-weight:900;font-size:2.9rem;color:var(--karaoke);line-height:1.15;}
  .english-big{font-weight:800;font-size:1.3rem;color:var(--ink);}
  .reveal-in{
    animation:revealIn 1.1s cubic-bezier(.22,.7,.25,1) both;
  }
  @keyframes revealIn{
    0%{opacity:0;transform:translateY(8px);filter:blur(8px);}
    40%{opacity:.55;filter:blur(4px);}
    100%{opacity:1;transform:none;filter:blur(0);}
  }
  .example-block{
    margin-top:.9rem;padding-top:.9rem;border-top:1px dashed var(--border);width:100%;
    display:flex;flex-direction:column;gap:.3rem;
  }
  .example-karaoke{color:var(--karaoke);font-weight:700;font-size:1.55rem;line-height:1.3;}
  .example-english{color:var(--ink-soft);font-style:italic;font-size:1.05rem;}
  .tap-hint{margin-top:auto;padding-top:1.2rem;color:var(--ink-soft);font-weight:800;font-size:.85rem;display:flex;align-items:center;gap:.4rem;}
  .study-badge{
    margin-top:auto;padding-top:1.2rem;color:var(--teal-dark);font-weight:800;font-size:.82rem;
    display:flex;align-items:center;gap:.4rem;background:var(--teal-tint);border-radius:999px;padding:.4rem .9rem;
  }
  .sparkle{position:absolute;pointer-events:none;font-size:1.1rem;animation:sparkleUp 1s ease-out forwards;}
  @keyframes sparkleUp{
    0%{opacity:0;transform:translateY(0) scale(.4) rotate(0deg);}
    18%{opacity:1;}
    100%{opacity:0;transform:translateY(-80px) scale(1.1) rotate(30deg);}
  }

  .stage-nav{display:flex;align-items:center;justify-content:center;gap:1rem;padding-top:1.6rem;}
  .nav-arrow{
    width:3rem;height:3rem;border-radius:50%;background:rgba(255,255,255,.16);color:#fff;border:none;
    font-size:1.2rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s;
  }
  .nav-arrow:hover{background:rgba(255,255,255,.3);}
  .nav-arrow[disabled]{opacity:.35;cursor:not-allowed;}
  .next-btn{min-width:9rem;justify-content:center;}

  .done-card{
    background:var(--surface);border-radius:28px;padding:3rem 2rem;text-align:center;max-width:460px;
    margin:0 auto;box-shadow:0 24px 60px -20px rgba(0,0,0,.4);
  }
  .done-card .big-emoji{font-size:3rem;margin-bottom:.6rem;display:block;}
  .done-actions{display:flex;gap:.6rem;justify-content:center;margin-top:1.4rem;flex-wrap:wrap;}

  /* ============ MANAGE ============ */
  .manage-wrap{max-width:800px;margin:0 auto;padding:2rem 1.5rem 4rem;}
  .manage-head{display:flex;align-items:center;justify-content:space-between;gap:1rem;margin-bottom:1.6rem;flex-wrap:wrap;}
  .save-note{
    display:flex;align-items:center;gap:.5rem;font-weight:700;font-size:.85rem;color:var(--ink-soft);
    background:var(--surface-2);border:1px solid var(--border);border-radius:14px;padding:.7rem 1rem;margin-bottom:1.4rem;
  }
  .topic-block{background:var(--surface);border:1px solid var(--border);border-radius:20px;margin-bottom:1rem;overflow:hidden;}
  .topic-block-head{display:flex;align-items:center;gap:.8rem;padding:1rem 1.2rem;cursor:pointer;}
  .topic-block-head .topic-icon{width:2.5rem;height:2.5rem;font-size:1.25rem;flex-shrink:0;}
  .topic-block-head h3{flex:1;font-size:1.02rem;}
  .chev{transition:transform .18s ease;color:var(--ink-soft);}
  .topic-block.open .chev{transform:rotate(180deg);}
  .topic-block-body{display:none;padding:0 1.2rem 1.2rem;}
  .topic-block.open .topic-block-body{display:block;}
  .word-row{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:.6rem;align-items:center;padding:.55rem 0;border-top:1px solid var(--border);font-size:.88rem;}
  .word-row .thai{font-size:1.05rem;}
  .word-row .wk{color:var(--karaoke);font-weight:700;}
  .word-row .we{color:var(--ink-soft);}
  .row-actions{display:flex;gap:.3rem;justify-content:flex-end;}
  .icon-btn{width:1.9rem;height:1.9rem;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--ink-soft);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:.85rem;}
  .icon-btn:hover{border-color:var(--teal);color:var(--teal);}
  .icon-btn.danger:hover{border-color:var(--coral);color:var(--coral);}
  .word-form{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;background:var(--surface-2);border-radius:14px;padding:1rem;margin-top:.8rem;}
  .field{display:flex;flex-direction:column;gap:.3rem;}
  .field.full{grid-column:1/-1;}
  .field label{font-weight:800;font-size:.72rem;letter-spacing:.03em;text-transform:uppercase;color:var(--ink-soft);}
  .field input{border:1px solid var(--border);border-radius:10px;padding:.55rem .7rem;font-size:.92rem;font-family:inherit;background:var(--surface);color:var(--ink);}
  .field input.thai{font-size:1.1rem;}
  .field input:focus{border-color:var(--teal);}
  .word-form-actions{grid-column:1/-1;display:flex;gap:.5rem;justify-content:flex-end;margin-top:.2rem;}
  .add-topic-form{display:flex;gap:.6rem;flex-wrap:wrap;align-items:flex-end;background:var(--surface-2);border:1px dashed var(--border);border-radius:16px;padding:1rem;}
  .add-topic-form .field{flex:1;min-width:140px;}
  .empty-note{color:var(--ink-soft);font-size:.88rem;padding:.9rem 0 .3rem;}

  #toast{
    position:fixed;bottom:1.4rem;left:50%;transform:translateX(-50%) translateY(120%);
    background:var(--ink);color:var(--bg);font-weight:800;font-size:.88rem;padding:.75rem 1.3rem;
    border-radius:999px;box-shadow:0 10px 30px -10px rgba(0,0,0,.5);z-index:100;
    transition:transform .25s cubic-bezier(.3,.9,.4,1.2);display:flex;align-items:center;gap:.5rem;
  }
  #toast.show{transform:translateX(-50%) translateY(0);}

  @media (max-width:560px){
    .word-row{grid-template-columns:1fr;gap:.15rem;padding:.7rem 0;}
    .row-actions{justify-content:flex-start;margin-top:.3rem;}
    .word-form{grid-template-columns:1fr;}
    .thai-word{font-size:1.15rem;}
    .karaoke-big{font-size:2.2rem;}
    .example-karaoke{font-size:1.25rem;}
    .example-english{font-size:.95rem;}
  }
</style>

<div id="app">

  <!-- ============ HOME VIEW ============ -->
  <section id="view-home" class="view active">
    <div class="topnav">
      <button class="brand" id="brand-btn">
        <span class="mark">🗣️</span> Say It Thai
      </button>
    </div>

    <div class="hero">
      <div class="hero-circle" style="width:220px;height:220px;background:var(--gold);top:-90px;left:-60px;"></div>
      <div class="hero-circle" style="width:160px;height:160px;background:#fff;opacity:.15;bottom:-50px;right:8%;"></div>
      <div class="hero-circle" style="width:100px;height:100px;background:var(--gold);opacity:.35;top:20px;right:14%;"></div>
      <div class="hero-inner">
        <span class="pill" id="stats-pill">98 words · 11 topics</span>
        <h1>Which words are we learning today?</h1>
        <p>Pick a topic to study the words, then switch to Part 1 or Part 2 to play.</p>
      </div>
    </div>

    <div class="topics-wrap">
      <div class="topics-grid" id="topics-grid"></div>
    </div>

    <p class="footer-note">Made for class</p>
  </section>

  <!-- ============ PLAY VIEW ============ -->
  <section id="view-play" class="view">
    <div class="stage" id="stage">
      <div class="stage-bar">
        <div class="stage-bar-left">
          <button class="btn btn-ghost" style="color:#fff;" data-nav="home">← Topics</button>
          <button class="btn btn-ghost sidebar-toggle-btn" style="color:#fff;" id="sidebar-toggle">📋 Words</button>
          <span class="stage-title"><span id="play-emoji">👋</span> <span id="play-topic-name">Topic</span></span>
        </div>
        <div class="stage-bar-left">
          <div class="mode-toggle">
            <button class="mode-btn" id="mode-study">📖 Study</button>
            <button class="mode-btn" id="mode-part1">🎮 Part 1</button>
            <button class="mode-btn" id="mode-part2">🎮 Part 2</button>
          </div>
          <button class="btn btn-ghost" style="color:#fff;" id="shuffle-btn" title="Shuffle this topic">🔀</button>
          <span class="progress-pill" id="progress-pill">1 / 7</span>
        </div>
      </div>
      <p class="mode-caption" id="mode-caption">Every word in this topic, all shown — browse or click any word on the left.</p>

      <div class="stage-body">
        <div class="sidebar-backdrop" id="sidebar-backdrop"></div>
        <aside class="word-sidebar" id="word-sidebar"></aside>

        <div class="stage-main">
          <div class="card-wrap" id="card-wrap"></div>
          <div class="stage-nav" id="stage-nav">
            <button class="nav-arrow" id="prev-btn" aria-label="Previous word">‹</button>
            <button class="btn btn-gold next-btn" id="next-btn">Next word →</button>
            <button class="nav-arrow" id="restart-btn" aria-label="Restart topic" title="Restart topic">↺</button>
          </div>
        </div>
      </div>
    </div>
  </section>


</div>

<div id="toast"></div>

<script>
(function(){

  var PASTELS = ["#FFE9CC","#CFEAF7","#E0C3FC","#FFF3B0","#FFB4B4","#B8F2E6","#FFD6BA","#D6E4FF","#FFD1DC","#FFE5A0"];
  var MODE_CAPTIONS = {
    study: 'Every word in this topic, all shown — browse or click any word on the left.',
    part1: 'Guess the meaning — Thai and pronunciation are shown, click to reveal what it means.',
    part2: 'Guess the pronunciation — Thai and meaning are shown, click to reveal how to say it.'
  };
  var MODE_PROMPTS = { part1: 'What does it mean?', part2: 'How do you say it?' };

  var state = null;

  var nav = { view:'home', topicId:null, words:[], order:[], index:0, revealed:false, mode:'study', topicName:'', topicEmoji:'', colorIdx:0 };

  function boot(){
    state = loadEmbeddedState();
    renderHome();
    route();
    window.addEventListener('hashchange', route);
    window.addEventListener('keydown', onKeydown);
  }

  function loadEmbeddedState(){
    try { return JSON.parse(JSON.stringify(SEED_DATA)); }
    catch(e){ return { topics: [] }; }
  }

  /* ---------- routing ---------- */
  function route(){
    var hash = location.hash.replace('#','');
    var parts = hash.split('/');
    if (parts[0] === 'play' && parts[1]) {
      var freshTopic = nav.topicId !== parts[1];
      nav.view = 'play';
      startTopic(parts[1], freshTopic);
    } else {
      nav.view = 'home';
    }
    showView(nav.view);
    closeSidebarDrawer();
  }

  function showView(name){
    ['home','play'].forEach(function(v){
      document.getElementById('view-'+v).classList.toggle('active', v === name);
    });
  }

  document.addEventListener('click', function(e){
    var el = e.target.closest('[data-nav]');
    if (el) { location.hash = '#' + el.getAttribute('data-nav'); }
  });

  var toastTimer = null;
  function toast(msg){
    var el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ el.classList.remove('show'); }, 2600);
  }

  /* ================= HOME ================= */
  function renderHome(){
    var grid = document.getElementById('topics-grid');
    var totalWords = 0;
    state.topics.forEach(function(t){ totalWords += t.words.length; });
    document.getElementById('stats-pill').textContent = totalWords + ' words · ' + state.topics.length + ' topics';

    var html = '';

    state.topics.forEach(function(t, i){
      var color = PASTELS[i % PASTELS.length];
      html += '<button class="topic-card" data-nav="play/' + t.id + '">' +
        '<span class="topic-icon" style="background:' + color + ';">' + t.emoji + '</span>' +
        '<h3>' + escapeHtml(t.name) + '</h3>' +
        '<span class="topic-meta">' + t.words.length + ' word' + (t.words.length===1?'':'s') + '</span>' +
        '</button>';
    });
    grid.innerHTML = html;
  }

  /* ================= PLAY ================= */
  function shuffleArr(arr){
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  function startTopic(topicId, resetToStudy){
    var words, name, emoji, colorIdx;
    if (topicId === '__all__') {
      words = [];
      state.topics.forEach(function(t){
        t.words.forEach(function(w){ words.push(Object.assign({}, w, { _topicName: t.name, _emoji: t.emoji })); });
      });
      name = 'All topics'; emoji = '🔀'; colorIdx = -1;
    } else {
      var t = state.topics.filter(function(x){ return x.id === topicId; })[0];
      if (!t) { location.hash = '#home'; return; }
      words = t.words.slice();
      name = t.name; emoji = t.emoji; colorIdx = state.topics.indexOf(t);
    }
    nav.topicId = topicId;
    nav.words = words;
    nav.order = words.map(function(_, i){ return i; });
    nav.index = 0;
    nav.revealed = false;
    if (resetToStudy) nav.mode = 'study';
    nav.topicName = name;
    nav.topicEmoji = emoji;
    nav.colorIdx = colorIdx;
    document.getElementById('play-emoji').textContent = emoji;
    document.getElementById('play-topic-name').textContent = name;
    renderPlayShell();
  }

  function renderPlayShell(){
    if (nav.view !== 'play') return;
    ['study','part1','part2'].forEach(function(m){
      document.getElementById('mode-' + m).classList.toggle('active', nav.mode === m);
    });
    document.getElementById('mode-caption').textContent = MODE_CAPTIONS[nav.mode];
    renderSidebar();
    renderCard();
  }

  function currentWord(){
    if (!nav.words || !nav.words.length) return null;
    var idx = nav.order[nav.index];
    return nav.words[idx];
  }

  /* ---- sidebar ---- */
  function renderSidebar(){
    var el = document.getElementById('word-sidebar');
    if (!nav.words || !nav.words.length) { el.innerHTML = ''; return; }
    var html = '';
    nav.order.forEach(function(wordIdx, pos){
      var w = nav.words[wordIdx];
      var isCurrent = pos === nav.index && nav.index < nav.words.length;
      html += '<button class="sidebar-item' + (isCurrent ? ' current' : '') + '" data-jump="' + pos + '">' +
        '<span class="sidebar-num">' + (pos + 1) + '</span>' +
        '<span class="sw">' + escapeHtml(w.thai) + '</span>' +
        '</button>';
    });
    el.innerHTML = html;
    var current = el.querySelector('.sidebar-item.current');
    if (current) current.scrollIntoView({ block: 'nearest' });
  }

  document.getElementById('word-sidebar').addEventListener('click', function(e){
    var btn = e.target.closest('[data-jump]');
    if (!btn) return;
    nav.index = parseInt(btn.getAttribute('data-jump'), 10);
    nav.revealed = false;
    renderCard();
    renderSidebar();
    closeSidebarDrawer();
  });

  function openSidebarDrawer(){
    document.getElementById('word-sidebar').classList.add('open');
    document.getElementById('sidebar-backdrop').classList.add('open');
  }
  function closeSidebarDrawer(){
    document.getElementById('word-sidebar').classList.remove('open');
    document.getElementById('sidebar-backdrop').classList.remove('open');
  }
  document.getElementById('sidebar-toggle').addEventListener('click', openSidebarDrawer);
  document.getElementById('sidebar-backdrop').addEventListener('click', closeSidebarDrawer);

  /* ---- card rendering ---- */
  function renderCard(){
    var wrap = document.getElementById('card-wrap');
    var navEl = document.getElementById('stage-nav');
    var total = nav.words ? nav.words.length : 0;

    if (!total) {
      wrap.innerHTML = '<div class="done-card"><span class="big-emoji">🗂️</span><h2>No words in this topic yet</h2>' +
        '<p style="color:var(--ink-soft);margin-top:.5rem;">Add some in Manage words.</p>' +
        '<div class="done-actions"><a class="btn btn-teal" href="#manage">Manage words</a></div></div>';
      navEl.style.visibility = 'hidden';
      return;
    }

    if (nav.index >= total) {
      wrap.innerHTML = '<div class="done-card">' +
        '<span class="big-emoji">🎉</span>' +
        '<h2>Nice! You covered all ' + total + ' word' + (total===1?'':'s') + '</h2>' +
        '<p style="color:var(--ink-soft);margin-top:.5rem;">' + escapeHtml(nav.topicName) + '</p>' +
        '<div class="done-actions">' +
        '<button class="btn btn-teal" id="play-again">↺ Play again</button>' +
        '<button class="btn btn-gold" id="play-shuffle">🔀 Shuffle</button>' +
        '<a class="btn btn-outline" href="#home">Topics</a>' +
        '</div></div>';
      navEl.style.visibility = 'hidden';
      document.getElementById('play-again').onclick = function(){ nav.index = 0; nav.revealed = false; renderCard(); renderSidebar(); };
      document.getElementById('play-shuffle').onclick = function(){ nav.order = shuffleArr(nav.order.slice(0, total)); nav.index = 0; nav.revealed = false; renderCard(); renderSidebar(); };
      document.getElementById('progress-pill').textContent = total + ' / ' + total;
      return;
    }

    navEl.style.visibility = 'visible';
    var w = currentWord();
    document.getElementById('progress-pill').textContent = (nav.index + 1) + ' / ' + total;
    document.getElementById('prev-btn').disabled = nav.index === 0;

    var color = nav.colorIdx === -1 || nav.colorIdx === undefined
      ? PASTELS[nav.index % PASTELS.length]
      : PASTELS[nav.colorIdx % PASTELS.length];

    var isStudy = nav.mode === 'study';
    var isPart1 = nav.mode === 'part1';   // English disappears
    var isPart2 = nav.mode === 'part2';   // Thai romanized disappears
    var revealed = isStudy || nav.revealed;

    var html = '<div class="flashcard' + (isStudy ? '' : ' playable') + '" id="flashcard">';
    html += '<span class="card-badge">' + (nav.index + 1) + '</span>';
    html += '<span class="card-icon" style="background:' + color + ';">' + (w._emoji || nav.topicEmoji) + '</span>';
    if (!isStudy) html += '<p class="prompt-label">' + MODE_PROMPTS[nav.mode] + '</p>';
    html += '<p class="thai-word">' + escapeHtml(w.thai) + '</p>';

    html += '<div class="reveal-zone">';
    if (isStudy) {
      html += '<p class="karaoke-big">' + escapeHtml(w.karaoke) + '</p>';
      html += '<p class="english-big">' + escapeHtml(w.english) + '</p>';
    } else if (isPart1) {
      // karaoke always visible; meaning hidden until reveal
      html += '<p class="karaoke-big">' + escapeHtml(w.karaoke) + '</p>';
      if (revealed) html += '<p class="english-big reveal-in">' + escapeHtml(w.english) + '</p>';
    } else if (isPart2) {
      // meaning always visible; karaoke hidden until reveal
      html += '<p class="english-big">' + escapeHtml(w.english) + '</p>';
      if (revealed) html += '<p class="karaoke-big reveal-in">' + escapeHtml(w.karaoke) + '</p>';
    }
    html += '</div>';

    var hasExample = w.exKaraoke || w.exEnglish;
    if (hasExample) {
      if (isStudy) {
        html += '<div class="example-block">';
        if (w.exKaraoke) html += '<p class="example-karaoke">' + escapeHtml(w.exKaraoke) + '</p>';
        if (w.exEnglish) html += '<p class="example-english">' + escapeHtml(w.exEnglish) + '</p>';
        html += '</div>';
      } else if (isPart1) {
        // example (romanized) shown as a clue; its translation is part of the answer
        html += '<div class="example-block">';
        if (w.exKaraoke) html += '<p class="example-karaoke">' + escapeHtml(w.exKaraoke) + '</p>';
        if (revealed && w.exEnglish) html += '<p class="example-english reveal-in" style="animation-delay:.25s;">' + escapeHtml(w.exEnglish) + '</p>';
        html += '</div>';
      } else if (isPart2) {
        // example translation shown as a clue; its romanized form is part of the answer
        html += '<div class="example-block">';
        if (w.exEnglish) html += '<p class="example-english">' + escapeHtml(w.exEnglish) + '</p>';
        if (revealed && w.exKaraoke) html += '<p class="example-karaoke reveal-in" style="animation-delay:.25s;">' + escapeHtml(w.exKaraoke) + '</p>';
        html += '</div>';
      }
    }

    if (isStudy) {
      html += '<p class="study-badge">📖 Studying — switch to Part 1 or Part 2 to play</p>';
    } else if (!revealed) {
      html += '<p class="tap-hint">👆 Click to reveal</p>';
    }
    html += '</div>';

    wrap.innerHTML = html;
    var cardEl = document.getElementById('flashcard');
    if (!isStudy) cardEl.addEventListener('click', onCardClick);
    updateNextBtn();
  }

  function onCardClick(e){
    if (nav.mode !== 'study' && !nav.revealed) {
      revealAnswer();
      burstSparkles(e.currentTarget);
    }
  }

  // Reveal the answer in place: fades just the answer text in slowly,
  // without re-rendering (and re-popping) the whole card.
  function revealAnswer(){
    if (nav.mode === 'study' || nav.revealed) return;
    nav.revealed = true;
    var w = currentWord();
    var isPart1 = nav.mode === 'part1';
    var card = document.getElementById('flashcard');
    if (!card) { renderCard(); return; }

    var zone = card.querySelector('.reveal-zone');
    if (zone && !zone.querySelector(isPart1 ? '.english-big' : '.karaoke-big')) {
      var p = document.createElement('p');
      p.className = (isPart1 ? 'english-big' : 'karaoke-big') + ' reveal-in';
      p.textContent = isPart1 ? w.english : w.karaoke;
      zone.appendChild(p);
    }

    var exBlock = card.querySelector('.example-block');
    if (exBlock) {
      var exText = isPart1 ? w.exEnglish : w.exKaraoke;
      var exClass = isPart1 ? 'example-english' : 'example-karaoke';
      if (exText && !exBlock.querySelector('.' + exClass)) {
        var ep = document.createElement('p');
        ep.className = exClass + ' reveal-in';
        ep.style.animationDelay = '.25s';
        ep.textContent = exText;
        exBlock.appendChild(ep);
      }
    }

    var hint = card.querySelector('.tap-hint');
    if (hint) hint.style.display = 'none';

    updateNextBtn();
  }

  function burstSparkles(cardEl){
    var icons = ['✨','⭐','🎉'];
    for (var i = 0; i < 5; i++) {
      var s = document.createElement('span');
      s.className = 'sparkle';
      s.textContent = icons[i % icons.length];
      s.style.left = (20 + Math.random() * 60) + '%';
      s.style.top = (30 + Math.random() * 30) + '%';
      s.style.animationDelay = (i * 60) + 'ms';
      cardEl.appendChild(s);
      (function(node){ setTimeout(function(){ node.remove(); }, 1100); })(s);
    }
  }

  function updateNextBtn(){
    var btn = document.getElementById('next-btn');
    if (nav.mode === 'study') {
      btn.textContent = 'Next word →';
      btn.onclick = function(){ nav.index++; renderCard(); renderSidebar(); };
    } else {
      btn.textContent = nav.revealed ? 'Next word →' : 'Reveal ▸';
      btn.onclick = function(){
        if (!nav.revealed) { revealAnswer(); return; }
        nav.index++; nav.revealed = false; renderCard(); renderSidebar();
      };
    }
  }

  document.getElementById('prev-btn').addEventListener('click', function(){
    if (nav.index > 0) { nav.index--; nav.revealed = false; renderCard(); renderSidebar(); }
  });
  document.getElementById('restart-btn').addEventListener('click', function(){
    nav.index = 0; nav.revealed = false;
    nav.order = nav.words ? nav.words.map(function(_,i){return i;}) : [];
    renderCard(); renderSidebar();
  });
  document.getElementById('shuffle-btn').addEventListener('click', function(){
    if (!nav.words) return;
    nav.order = shuffleArr(nav.order);
    nav.index = 0; nav.revealed = false;
    renderCard(); renderSidebar();
    toast('🔀 Shuffled!');
  });
  ['study','part1','part2'].forEach(function(m){
    document.getElementById('mode-' + m).addEventListener('click', function(){
      nav.mode = m; nav.revealed = false; renderPlayShell();
    });
  });

  function onKeydown(e){
    if (nav.view !== 'play') return;
    if (e.key === ' ' || e.key === 'Enter') {
      e.preventDefault();
      if (nav.mode !== 'study' && !nav.revealed) { revealAnswer(); }
      else { nav.index++; nav.revealed = false; renderCard(); renderSidebar(); }
    } else if (e.key === 'ArrowRight') {
      nav.index++; nav.revealed = false; renderCard(); renderSidebar();
    } else if (e.key === 'ArrowLeft') {
      if (nav.index > 0) { nav.index--; nav.revealed = false; renderCard(); renderSidebar(); }
    } else if (e.key === 'Escape') {
      location.hash = '#home';
    }
  }

  /* ---------- utils ---------- */
  function escapeHtml(str){
    return String(str==null?'':str).replace(/[&<>"']/g, function(c){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }

  boot();
})();
</script>

</body></html>
